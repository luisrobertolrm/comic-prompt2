services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumi}
      POSTGRES_DB: ${POSTGRES_DB:-sumi_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sumi} -d ${POSTGRES_DB:-sumi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve a DATABASE_URL para apontar ao container do Postgres.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sumi}:${POSTGRES_PASSWORD:-sumi}@db:5432/${POSTGRES_DB:-sumi_db}
      IMAGES_DIR: /app/static/images
      APP_ENV: production
      APP_RELOAD: "false"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - images:/app/static/images
    depends_on:
      db:
        condition: service_healthy
    # Roda as migrations antes de subir a API (Alembic não roda no build).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn prompt_clinica.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  images:
