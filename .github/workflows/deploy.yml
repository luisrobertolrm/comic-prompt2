name: Deploy sumi
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync e build
        run: |
          rsync -av --exclude='.env' $GITHUB_WORKSPACE/ /DATA/comic-prompt2/
          cd /DATA/comic-prompt2
          docker compose up -d --build
